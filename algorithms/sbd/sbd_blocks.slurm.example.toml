# Required for Slurm
hpc_target = "slurm" 
project = "YOUR_SLURM_ACCOUNT"
queue = "YOUR_SLURM_PARTITION"
work_dir = "/path/where/you/want/sbd_jobs"
sbd_executable = "/path/to/qcsc-prefect/algorithms/sbd/native/diag"

# Optional execution profile
launcher = "srun"
walltime = "00:15:00"
num_nodes = 1
mpiprocs = 8
modules = []
mpi_options = []

# Optional block/variable names
command_block_name = "cmd-sbd-diag"
execution_profile_block_name = "exec-sbd-mpi"     # Default: "exec-sbd-slurm"
hpc_profile_block_name = "hpc-slurm-sbd"          # Default: "hpc-slurm-sbd"
solver_block_name = "davidson-solver"             # Default: "davidson-solver-slurm"
options_variable_name = "sqd_options"

# Optional solver script / metrics naming
# script_filename = "sbd_solver.slurm"            # Slurm default
# metrics_artifact_key = "slurm-sbd-metrics"      # Slurm default

# Optional solver parameters
task_comm_size = 1
adet_comm_size = 1
bdet_comm_size = 1
# Fast preset for low-accuracy runs
block = 4
iteration = 1
tolerance = 0.01
carryover_ratio = 0.1
solver_mode = "cpu"

# Optional runtime options variable
# Default if omitted: {"params":{"shots":50000}} for Slurm
